
name: Build Physics Playground APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract all nested ZIP files
        shell: bash
        run: |
          mkdir -p extracted

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found!"
            exit 1
          fi

          unzip -o "$ZIP_FILE" -d extracted

          for round in {1..10}; do
            mapfile -d '' ZIPS < <(find extracted -type f -iname "*.zip" -print0)

            if [ ${#ZIPS[@]} -eq 0 ]; then
              break
            fi

            for ZIP in "${ZIPS[@]}"; do
              echo "Extracting nested archive: $ZIP"
              unzip -o "$ZIP" -d "$(dirname "$ZIP")"
              rm "$ZIP"
            done
          done

      - name: Find actual app project
        shell: bash
        run: |
          APP_DIR=""

          while IFS= read -r -d '' FILE; do
            DIR=$(dirname "$FILE")

            if compgen -G "$DIR/capacitor.config.*" > /dev/null && [ -f "$DIR/www/index.html" ]; then
              APP_DIR="$DIR"
              break
            fi
          done < <(find extracted -type f -name "package.json" -print0)

          if [ -z "$APP_DIR" ]; then
            echo "Could not find the complete app project."
            echo "Extracted files:"
            find extracted -maxdepth 6 -type f
            exit 1
          fi

          echo "Found app at: $APP_DIR"
          echo "APP_DIR=$GITHUB_WORKSPACE/$APP_DIR" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: |
          npm install
          npm install @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7 matter-js

      - name: Prepare game
        working-directory: ${{ env.APP_DIR }}
        run: |
          mkdir -p www
          cp node_modules/matter-js/build/matter.min.js www/matter.min.js

      - name: Create Android project
        working-directory: ${{ env.APP_DIR }}
        run: npx cap add android

      - name: Sync Android project
        working-directory: ${{ env.APP_DIR }}
        run: npx cap sync android

      - name: Build APK
        working-directory: ${{ env.APP_DIR }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Physics-Playground-debug-APK
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
